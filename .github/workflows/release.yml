name: Release (PyInstaller)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --clean --noconfirm --onefile --name veilproxy veilproxy.py

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf veilproxy-${{ matrix.platform }}.tar.gz -C dist veilproxy

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Force -Path dist\veilproxy.exe -DestinationPath veilproxy-${{ matrix.platform }}.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            veilproxy-*.tar.gz
            veilproxy-*.zip


  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish SHA256SUMS.txt over every published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir dist && cd dist
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber
          # Leave the sum file itself out: the shell creates SHA256SUMS.txt for
          # the redirect before find runs, and its own empty hash would make
          # every sha256sum -c end with one FAILED line.
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
